<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Analyze</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-video-wrapper">
        <video autoplay muted loop playsinline class="bg-video-content">
            <source src="{{ url_for('static', filename='bg_video.mp4') }}" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div style="display: flex; height: 100vh; justify-content: center; align-items: center;">
        <div class="glass-panel">
            <h2>Data Analysis</h2>
            <form action="/predict" method="POST">
                <textarea name="message" placeholder="Paste post text here..." required></textarea>
                <button type="submit" class="btn-primary" style="width: 100%;">Process Insights</button>
            </form>
        </div>
    </div>
</body>
</html>
